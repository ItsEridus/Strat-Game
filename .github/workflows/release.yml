name: Release

on:
  push:
    tags: ['v*']
    # Pushing a new version or new release notes to the development branch also publishes a release,
    # tagged v<package.json version>.
    branches: [claude/brave-mccarthy-h4uawp]
    paths: [package.json, docs/RELEASE_NOTES.md, launcher/**, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = tag ]; then TAG="${{ github.ref_name }}"
          else TAG="v$(node -p 'require("./package.json").version')"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: npm ci
      - run: npm test
      - name: Build the Windows game
        run: ./launcher/build.sh "$TAG"
      - name: Checksum for the auto-updater
        run: (cd release && sha256sum MeridianReach.exe | cut -d' ' -f1 > MeridianReach.exe.sha256)
      - name: Package the browser build
        run: |
          mkdir -p pkg/MeridianReach
          cp -r index.html assets dist Play.bat README.md pkg/MeridianReach/
          (cd pkg && zip -qr "../release/MeridianReach-$TAG-web.zip" MeridianReach)
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/MeridianReach.exe
            release/MeridianReach.exe.sha256
            release/MeridianReach-*-web.zip

  # Runs the EXE on real Windows: the game window must open (even with the old
  # launcher port taken), stay single-instance and close cleanly from its close button. The screenshot is kept as an artifact.
  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Launch, check and close the game window
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class U { [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l); }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          # Something else holds the old launcher port: the window must not care.
          $blocker = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 27183)
          $blocker.Start()
          $p = Start-Process -FilePath .\MeridianReach.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "the game exited on start (code $($p.ExitCode))" }
          $proc = Get-Process -Id $p.Id
          Write-Host "window: '$($proc.MainWindowTitle)'"
          if ($proc.MainWindowTitle -ne 'Meridian Reach') { throw "no game window (title '$($proc.MainWindowTitle)')" }
          if (-not (Test-Path "$env:LOCALAPPDATA\MeridianReach\game\index.html")) { throw "game files were not extracted" }
          # A second launch must hand over to the open window and exit.
          $second = Start-Process -FilePath .\MeridianReach.exe -PassThru
          if (-not $second.WaitForExit(10000)) { throw "a second launch did not exit" }
          if ((Get-Process -Name MeridianReach).Count -ne 1) { throw "more than one game process" }
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\window.png")
          [U]::PostMessage($proc.MainWindowHandle, 0x10, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
          if (-not $p.WaitForExit(15000)) { throw "the game did not close from its close button" }
          $blocker.Stop()
          Write-Host "closed cleanly"
      - name: Auto-update installs a downloaded update and restarts
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class U2 { [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l); }
          "@
          $u = "$env:LOCALAPPDATA\MeridianReach\update"
          New-Item -ItemType Directory -Force $u | Out-Null
          Copy-Item .\MeridianReach.exe "$u\MeridianReach-v99.0.0.exe"
          Start-Process -FilePath .\MeridianReach.exe | Out-Null
          Start-Sleep -Seconds 25
          if (Test-Path "$u\MeridianReach-v99.0.0.exe") { throw "the downloaded update was not installed" }
          $procs = @(Get-Process -Name MeridianReach -ErrorAction SilentlyContinue)
          if ($procs.Count -ne 1) { throw "expected the updated game to be running once, found $($procs.Count)" }
          if ($procs[0].MainWindowTitle -ne 'Meridian Reach') { throw "no game window after the update" }
          if (Test-Path .\MeridianReach.exe.old) { throw "the previous version was not cleaned up" }
          [U2]::PostMessage($procs[0].MainWindowHandle, 0x10, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
          if (-not $procs[0].WaitForExit(20000)) { throw "the updated game did not close" }
          Write-Host "update installed and restarted"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: window.png

  release:
    needs: [build, smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Meridian Reach ${{ needs.build.outputs.tag }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/MeridianReach.exe
            release/MeridianReach.exe.sha256
            release/MeridianReach-${{ needs.build.outputs.tag }}-web.zip
