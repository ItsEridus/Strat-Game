name: Release

on:
  push:
    tags: ['v*']
    # Pushing a new version or new release notes to the development branch also publishes a release,
    # tagged v<package.json version>.
    branches: [claude/brave-mccarthy-h4uawp]
    paths: [package.json, docs/RELEASE_NOTES.md, launcher/**, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = tag ]; then TAG="${{ github.ref_name }}"
          else TAG="v$(node -p 'require("./package.json").version')"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: npm ci
      - run: npm test
      - name: Build the Windows game
        run: ./launcher/build.sh "$TAG"
      - name: Package the browser build
        run: |
          mkdir -p pkg/MeridianReach
          cp -r index.html assets dist Play.bat README.md pkg/MeridianReach/
          (cd pkg && zip -qr "../release/MeridianReach-$TAG-web.zip" MeridianReach)
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/MeridianReach.exe
            release/MeridianReach-*-web.zip

  # Runs the EXE on real Windows: the game window must open, serve the game and
  # close cleanly from its close button. The screenshot is kept as an artifact.
  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Launch, check and close the game window
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class U { [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l); }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process -FilePath .\MeridianReach.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "the game exited on start (code $($p.ExitCode))" }
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:27183/__alive
          Write-Host "server version: $($r.Headers['X-Meridian-Reach'])"
          $proc = Get-Process -Id $p.Id
          Write-Host "window: '$($proc.MainWindowTitle)'"
          if ($proc.MainWindowTitle -ne 'Meridian Reach') { throw "no game window (title '$($proc.MainWindowTitle)')" }
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\window.png")
          if (-not (Test-Path "$env:APPDATA\MeridianReach")) { throw "no data folder in %APPDATA%" }
          [U]::PostMessage($proc.MainWindowHandle, 0x10, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
          if (-not $p.WaitForExit(15000)) { throw "the game did not close from its close button" }
          Write-Host "closed cleanly"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: window.png

  release:
    needs: [build, smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Meridian Reach ${{ needs.build.outputs.tag }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/MeridianReach.exe
            release/MeridianReach-${{ needs.build.outputs.tag }}-web.zip
